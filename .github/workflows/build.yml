name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build test APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      # Puts compiler errors in the run summary so they're easy to read
      - name: Report compile errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |What went wrong" -A2 build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg}"

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ScanStack.apk

      - name: Keep the APK with this build
        uses: actions/upload-artifact@v4
        with:
          name: ScanStack-apk
          path: ScanStack.apk

      # Publishes the newest build at <repo>/releases/tag/latest so it can be downloaded on a phone.
      - name: Publish as "latest" download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ScanStack.apk \
            --title "Latest test build" \
            --notes "Built from ${GITHUB_SHA::7}. Download ScanStack.apk on your Android phone and open it to install." \
            --prerelease
